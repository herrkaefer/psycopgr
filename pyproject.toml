[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "psycopgr"
dynamic = ["version"]
description = "Route between geographic coordinates with PostgreSQL and pgRouting."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Yang Liu"}]
dependencies = ["psycopg>=3.3,<4"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
binary = ["psycopg[binary]>=3.3,<4"]

[project.urls]
Repository = "https://github.com/herrkaefer/psycopgr"
Issues = "https://github.com/herrkaefer/psycopgr/issues"

[dependency-groups]
dev = ["psycopg[binary]>=3.3,<4", "build>=1.3", "twine>=6.2"]

[tool.setuptools]
packages = ["psycopgr"]

[tool.setuptools.dynamic]
version = {attr = "psycopgr.__version__.__version__"}
